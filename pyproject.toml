[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "speechdock"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<1",
  "h11>=0.16,<1",
  "python-multipart>=0.0.20,<1",
  "ruamel.yaml>=0.18,<1",
  "numpy>=1.26,<3",
  "onnxruntime>=1.17,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
